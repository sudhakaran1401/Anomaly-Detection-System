name: ADS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        working-directory: backend
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: db.sqlite3
          DB_HOST: ""
          DB_PORT: "3306"
          DB_USER: ci-user
          DB_PASSWORD: ci-password
          CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
          CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python manage.py check

      - name: Collect static files
        working-directory: backend
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: db.sqlite3
          DB_HOST: ""
          DB_PORT: "3306"
          DB_USER: ci-user
          DB_PASSWORD: ci-password
          CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
          CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python manage.py collectstatic --noinput

      - name: Run Django tests
        working-directory: backend
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: db.sqlite3
          DB_HOST: ""
          DB_PORT: "3306"
          DB_USER: ci-user
          DB_PASSWORD: ci-password
          CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
          CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python manage.py test

      - name: Run system testing
        working-directory: backend
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: db.sqlite3
          DB_HOST: ""
          DB_PORT: "3306"
          DB_USER: ci-user
          DB_PASSWORD: ci-password
          CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
          CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python manage.py test tests.system

      - name: Run acceptance testing
        working-directory: backend
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: db.sqlite3
          DB_HOST: ""
          DB_PORT: "3306"
          DB_USER: ci-user
          DB_PASSWORD: ci-password
          CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
          CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python manage.py test tests.acceptance

      - name: Run regression testing
        working-directory: backend
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: db.sqlite3
          DB_HOST: ""
          DB_PORT: "3306"
          DB_USER: ci-user
          DB_PASSWORD: ci-password
          CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
          CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python manage.py test tests.regression

      - name: Run reliability testing
        working-directory: backend
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: db.sqlite3
          DB_HOST: ""
          DB_PORT: "3306"
          DB_USER: ci-user
          DB_PASSWORD: ci-password
          CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
          CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python manage.py test tests.reliability

      - name: Run recovery testing
        working-directory: backend
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: db.sqlite3
          DB_HOST: ""
          DB_PORT: "3306"
          DB_USER: ci-user
          DB_PASSWORD: ci-password
          CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
          CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python manage.py test tests.recovery


  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:8000
        run: npm run build


  e2e:
    name: End-to-End Testing
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Install Playwright dependencies
        working-directory: testing
        run: |
          npm install
          npx playwright install --with-deps chromium firefox webkit

      - name: Collect static files
        working-directory: backend
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: db.sqlite3
          DB_HOST: ""
          DB_PORT: "3306"
          DB_USER: ci-user
          DB_PASSWORD: ci-password
          CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
          CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python manage.py collectstatic --noinput

      - name: Prepare E2E database
        working-directory: backend
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: db.sqlite3
          DB_HOST: ""
          DB_PORT: "3306"
          DB_USER: ci-user
          DB_PASSWORD: ci-password
          CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
          CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
        run: |
          python manage.py migrate --noinput
          python manage.py shell -c "from django.contrib.auth.models import User; User.objects.filter(username='e2e_test_user').exists() or User.objects.create_user(username='e2e_test_user', password='E2eTest@12345')"

      - name: Start backend
        working-directory: backend
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: db.sqlite3
          DB_HOST: ""
          DB_PORT: "3306"
          DB_USER: ci-user
          DB_PASSWORD: ci-password
          CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
          CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
        run: |
          nohup python manage.py runserver 0.0.0.0:8000 > /tmp/ads-backend.log 2>&1 &

      - name: Start frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:8000
        run: |
          nohup npm run dev -- --host 0.0.0.0 > /tmp/ads-frontend.log 2>&1 &

      - name: Wait for applications
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null && \
               curl -fsS http://127.0.0.1:8000/api/schema/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "Backend log:"
          cat /tmp/ads-backend.log || true

          echo "Frontend log:"
          cat /tmp/ads-frontend.log || true

          exit 1

      - name: Run Playwright E2E tests
        working-directory: testing
        env:
          CI: "true"
        run: |
          npx playwright test